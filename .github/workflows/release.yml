name: Release

# Runs when a version tag (for example 1.7.0) is pushed. It builds and tests the release, builds the signed
# Maven Central bundle and opens a draft GitHub release. Publishing to Maven Central stays manual.
on:
  push:
    tags: ['[0-9]+.[0-9]+.[0-9]+*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      ORG_GRADLE_PROJECT_signingKey: ${{ secrets.SIGNING_KEY }}
      ORG_GRADLE_PROJECT_signingPassword: ${{ secrets.SIGNING_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
      - name: Check the tag matches the version
        run: |
          version=$(grep '^version=' gradle.properties | cut -d= -f2)
          test "$version" = "$GITHUB_REF_NAME" || { echo "Tag $GITHUB_REF_NAME does not match version $version"; exit 1; }
      - name: Check the signing key is set
        run: test -n "$ORG_GRADLE_PROJECT_signingKey" || { echo "SIGNING_KEY secret is missing; Central rejects unsigned bundles"; exit 1; }
      - name: Build and test
        run: ./gradlew build
      - name: Build the Maven Central bundle
        run: ./gradlew centralBundle
      - name: Create a draft GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" --draft --generate-notes --title "MongoS Kotlin $GITHUB_REF_NAME" \
            build/libs/*.jar build/distributions/central-bundle-*.zip
